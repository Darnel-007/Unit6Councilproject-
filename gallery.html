<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery - British Values</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: black; font-family: Arial, sans-serif; }
        .page { width: 100%; max-width: 1200px; min-height: 100vh; margin: auto; background: black; }
        .header { height: 89px; border-bottom: 3px solid #00a6a6; position: relative; display: flex; align-items: center; justify-content: space-between; padding: 5px; }
        .flag { width: 107px; height: 76px; object-fit: contain; }
        .title { width: 220px; min-height: 53px; background: #aaa; text-align: center; padding: 10px; }
        .title h2 { font-size: 18px; margin: 5px 0; color: black; }
        .navigation { min-height: 43px; background: #aaa; border-bottom: 2px solid black; display: flex; flex-wrap: wrap; }
        .navigation a { color: black; text-decoration: none; font-size: 17px; padding: 12px 15px; display: block; }
        .navigation a:hover, .navigation a:focus { background: #777; color: white; }
        .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; padding: 25px; }
        .gallery img { width: 100%; height: 250px; object-fit: cover; transition: transform .3s, opacity .3s, box-shadow .3s; }
        .gallery img:hover { transform: scale(1.03); opacity: .8; box-shadow: 0 0 8px #00cccc; }
        .footer { color: white; text-align: center; font-size: 14px; padding: 20px; }
        @media (max-width: 800px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; padding: 15px; } .gallery img { height: 220px; } }
        @media (max-width: 500px) { .title { width: 170px; } .navigation a { font-size: 15px; padding: 12px 10px; } .gallery { grid-template-columns: 1fr; } .gallery img { height: auto; aspect-ratio: 4 / 3; } }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <img class="flag" src="images/uk-flag.png" alt="Union Jack flag">
        <div class="title"><h2>Image gallery</h2></div>
    </div>
    <nav class="navigation" aria-label="Main navigation">
        <a href="./index.html">Home</a>
        <a href="./about.html">About us</a>
        <a href="./gallery.html">Gallery</a>
    </nav>
    <div class="gallery">
        <img src="images/gallery-1.png" alt="London landmark">
        <img src="images/gallery-2.png" alt="City skyline">
        <img src="images/gallery-3.png" alt="Westminster Bridge and Big Ben">
        <img src="images/gallery-4.png" alt="Public building">
        <img src="images/gallery-5.png" alt="Modern office buildings">
        <img src="images/gallery-6.png" alt="Office building on a street">
        <img src="images/gallery-7.png" alt="Public building entrance">
        <img src="images/big-ben.png" alt="Big Ben at night">
        <img src="images/values-flag.png" alt="Union Jack flag">
    </div>
    <div class="footer"><p>British Values Website</p></div>
</div>
</body>
</html>
